<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Psiagora</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #F7F8FA; color: #1A2332; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
    .wrap { text-align: center; max-width: 440px; }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.3px; }
    p { font-size: 0.95rem; color: #5A6678; line-height: 1.6; margin-bottom: 28px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border-radius: 9px; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.15s; }
    .btn-primary { background: #00C48C; color: #fff; border: none; }
    .btn-primary:hover { background: #009B72; }
    .btn-ghost { background: transparent; color: #00C48C; border: 2px solid #00C48C; }
    .btn-ghost:hover { background: #E6F8F4; }
    .logo { position: fixed; top: 16px; left: 20px; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #00C48C, #2CC7C8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  </style>
</head>
<body>
  <a class="logo" href="/"><img src="/favicon.svg" width="22" height="22" alt=""><span>Psiagora</span></a>
  <div class="wrap">
    <div class="icon">🌿</div>
    <h1>Página não encontrada</h1>
    <p>A página que procura não existe ou foi movida. Não se preocupe — pode voltar ao início ou marcar uma consulta.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Voltar ao início</a>
      <a href="/equipa.html" class="btn btn-ghost">Agendar consulta</a>
    </div>
  </div>
</body>
</html>
